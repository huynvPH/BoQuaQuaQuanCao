name: Build APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BoQuaQuanCao-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Bản Cài Đặt APK v1.0.${{ github.run_number }}"
          body: |
            ### 📱 Tải file cài đặt APK cho máy ảo / điện thoại
            - Tải tệp **`app-debug.apk`** ở mục **Assets** bên dưới.
            - Kéo thả file APK vào trình giả lập (LDPlayer, BlueStacks, NoxPlayer, MuMu) hoặc cài trực tiếp trên máy thật.
            - Bật quyền Trợ năng (Accessibility) và tận hưởng!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
